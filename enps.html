<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Employee NPS Survey</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f8fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .survey-container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }
    .survey-container h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #444;
      font-size: 1rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    .nps-scale {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .nps-button {
      flex: 1;
      margin: 2px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      padding: 12px 0;
      cursor: pointer;
      color: #fff;
      transition: transform 0.1s ease;
    }
    .nps-button:hover {
      transform: scale(1.05);
    }
    .nps-button.selected {
      border: 2px solid #333;
      transform: scale(1.1);
    }
    .nps-button[data-score="0"],
    .nps-button[data-score="1"],
    .nps-button[data-score="2"],
    .nps-button[data-score="3"],
    .nps-button[data-score="4"],
    .nps-button[data-score="5"],
    .nps-button[data-score="6"] {
      background-color: #e74c3c;
    }
    .nps-button[data-score="7"],
    .nps-button[data-score="8"] {
      background-color: #f1c40f;
      color: #333;
    }
    .nps-button[data-score="9"],
    .nps-button[data-score="10"] {
      background-color: #2ecc71;
    }
    .confirmation {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      font-size: 1rem;
    }
    .confirmation input {
      margin-right: 10px;
      width: 18px;
      height: 18px;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .submit-btn:hover {
      background: #0056b3;
    }
    .success-message {
      text-align: center;
      color: green;
      margin-top: 15px;
      font-weight: bold;
    }
    #loadingSpinner {
      display: none;
      text-align: center;
      margin-top: 15px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="survey-container">
    <h2>Employee NPS Survey</h2>
    <form id="npsForm">
      <div class="form-group">
        <label for="businessName">Business Name:</label>
        <input type="text" id="businessName" required>
      </div>
      <div class="form-group">
        <label>On a scale of 0–10, how likely are you to recommend our company as a place to work?</label>
        <div class="nps-scale" id="npsScale"></div>
      </div>
      <div class="confirmation">
        <input type="checkbox" id="confirmation" required>
        <label for="confirmation">I confirm I work for this business and am scoring honestly.</label>
      </div>
      <button type="submit" class="submit-btn">Submit</button>
      <div id="loadingSpinner">⏳ Submitting your feedback...</div>
      <div id="successMessage" class="success-message"></div>
    </form>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbx7HXnAOqiTqlKS18LlKlIVcpfrHs7OGXrXyz_ODtXD70TQOaWVTydv7xdgX4R2akM/exec";
    const npsScale = document.getElementById('npsScale');
    const submitBtn = document.querySelector('.submit-btn');
    let selectedScore = null;

    for (let i = 0; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = i;
      btn.classList.add('nps-button');
      btn.setAttribute('data-score', i);
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nps-button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedScore = i;
      });
      npsScale.appendChild(btn);
    }

    document.getElementById('npsForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const businessName = document.getElementById('businessName').value.trim();
      const confirmation = document.getElementById('confirmation').checked;

      if (!businessName || selectedScore === null || !confirmation) {
        alert('Please complete all fields before submitting.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";
      document.getElementById('loadingSpinner').style.display = 'block';
      document.getElementById('successMessage').textContent = "";

      const formData = new FormData();
      formData.append("businessName", businessName);
      formData.append("score", selectedScore);
      formData.append("confirmation", confirmation ? "Yes" : "No");

      try {
        const response = await fetch(scriptURL, {
          method: 'POST',
          body: formData
        });
        const result = await response.json();

        if (result.result === "success") {
          window.location.href = "thank-you.html";
          this.reset();
          document.querySelectorAll('.nps-button').forEach(btn => btn.classList.remove('selected'));
          selectedScore = null;
        } else {
          throw new Error(result.message);
        }
      } catch (error) {
        alert("❌ Could not send your response. Please try again later.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
        document.getElementById('loadingSpinner').style.display = 'none';
      }
    });
  </script>
</body>
</html>
